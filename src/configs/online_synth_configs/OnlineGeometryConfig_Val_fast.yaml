# Online Synthetic Geometry Configuration (FAST validation copy)
#
# Identical to OnlineGeometryConfig_Val.yaml EXCEPT num_samples is reduced from
# 1000 -> 256. Rationale:
#   1. The full 1000-sample synthetic validation pass costs ~52 min (GPU-bound
#      shader rendering, ~25 s/it x 125 batches) -- the dominant validation cost
#      and the reason GLU-Net grid jobs never reached their step budget.
#   2. The online renderer natively aborts (SIGABRT, core dumped) at the
#      deterministic ~408th sample (batch 50/125). seed is fixed below, so the
#      first 256 samples are identical across all jobs and never reach the bad
#      geometry -> crash avoided.
# Caveat: 256-sample synthetic PCK is an unbiased but noisier estimate of the
# same quantity the 1000-sample catspp/raft rows used; fine for rank-based
# transfer analysis, minor inconsistency for absolute per-benchmark PCK.

# Shader configurations
shaders:
  # program0: "./rendering/shaders/terrain_sdf.glsl"
  program0: "./rendering/shaders/mandelbulb_background_new.glsl"
  program1: "./rendering/shaders/quatJulia.c"
  program2: "./rendering/shaders/quatJulia.c"
  program3: "./rendering/shaders/deformed_sphere.glsl"
  merge: "./rendering/shaders/merge.glsl"



# Mandelbulb sampler configuration
mandelbulb_sampler:
  power_range:
    min: 1.5
    offset: 2.5


# Dataset settings
num_samples: 256
random_flip: 0.5
random_swap: true
julia_sampler:
  distribution: uniform
  loc: 3
  scale: 9
angle_sampler:
  x_components:
    distribution: uniform
    loc: -0.16667
    scale: 0.33333
  y_components:
    distribution: uniform
    loc: -0.16667
    scale: 0.33333
scale_sampler:
  abs_components:
    distribution: uniform
    loc: 0.5
    scale: 0.4
  rel_components:
    distribution: uniform
    loc: -0.25
    scale: 0.25


# Image configuration
size: 512  # [height, width]
crop: "center"

# Random seed
seed: 987654321
