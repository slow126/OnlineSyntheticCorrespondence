representation: flow
encoder: resnet101
batch_size: 8
num_workers: 4
sampling:
  max_vectors: 16000000
  vectors_per_image: 2048
  seed: 42
  shuffle: true
flow_normalization:
  enabled: true
  scheme: norm2x1
  image_size:
  - 512
  - 512
flow_space: joint
joint_alpha: 1.0
calibration:
  enabled: false
spaces:
  enabled:
  - joint
pca:
  enabled: false
coverage:
  self_radius_k: 1
  radius_quantile: 0.95
  neighbor_agg: kth
  k_max: 5
  k_values:
  - 1
  - 5
  compute_qnorm: false
  compute_rnorm: false
  compute_curves: true
  curve_quantiles:
  - 0.8
  - 0.9
  - 0.95
  - 0.99
epsilon_curves:
  enabled: true
  values_px:
  - 0.5
  - 0.75
  - 1
  - 1.5
  - 2
  - 3
  - 4
  - 6
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
kmeans:
  enabled: true
  k: 8192
  train_max: null
  niter: 20
  nredo: 1
  seed: 42
  use_gpu: true
  force_recompute: false
  require_cache: true
  batch_size: 100000
kmeans_manifold:
  self_radius_k: 1
  radius_quantile: 0.95
  neighbor_agg: kth
  weighted_radius: true
faiss:
  index_factory: IVF4096,Flat
  metric: l2
  use_gpu: true
  nprobe: 128
  batch_size: 100000
distance_metric:
  name: sqL2
  description: Squared L2 distances from FAISS (no sqrt applied)
cache:
  dir: /mnt/nvme_1tb_b/coverage_vectors
  mode: read_write
  format: npy
  mmap: true
  lazy_load: true
kl:
  enabled: false
  k_values:
  - 5
  - 20
  eps: 1e-12
  resume: true
  flush_each_pair: true
  results_file: analysis_v3/kl_flow_features.csv
output:
  results_file: analysis/coverage_v2_flow_ladder.csv
  curves_file: analysis/coverage_v2_flow_ladder_curves.csv
  kmeans_results_file: analysis/coverage_v2_flow_only_raw_joint_kmeans_full.csv
  kmeans_curves_file: analysis/coverage_v2_flow_only_raw_joint_kmeans_curves_full.csv
  kmeans_manifold_results_file: analysis/coverage_v2_flow_only_raw_joint_kmeans_manifold_full.csv
dataset_params:
  size:
  - 512
  - 512
  downsample_flow: 32
  max_kps: null
  dense_kps_use_all: true
  verbose: false
  debug: false
  normalize_images: false
  kitti_val_use_full_training: true
dataset_overrides:
  sintel:
    sintel_root: /home/spencer/Data
    normalize_images: true
  spair:
    datapath: ./models/Datasets_CATs
    normalize_images: false
  pfpascal:
    datapath: ./models/Datasets_CATs
    normalize_images: false
  pfwillow:
    datapath: ./models/Datasets_CATs
    normalize_images: false
  synthetic:
    geometry_config_path: src/configs/online_synth_configs/OnlineGeometryConfig.yaml
    processor_config_path: src/configs/online_synth_configs/OnlineProcessorConfig.yaml
    normalize_images: false
    device: cuda
  synthetic_2d_warp:
    geometry_config_path: src/configs/online_synth_configs/OnlineGeometryConfig.yaml
    processor_config_path: src/configs/online_synth_configs/OnlineProcessorConfig.yaml
    normalize_images: false
    synthetic_flow_warp: true
    synthetic_flow_warp_swap: true
    device: cuda
  imagenet2dwarp:
    datapath: hf://ILSVRC/imagenet-1k
    hf_streaming: false
    hf_max_samples: 5000
    hf_cache_dir: /home/spencer/.cache/huggingface/datasets
    normalize_images: true
    rotation_range:
    - -30.0
    - 30.0
    scale_range:
    - 0.5
    - 2.5
    translation_range:
    - -0.1
    - 0.1
    shear_range:
    - -0.2
    - 0.2
    cache_warp_params: true
    cache_dir: ./cache/imagenet2dwarp
    seed: 42
  pointodyssey:
    dataset_location: /home/spencer/Data/PointOdyssey
    normalize_images: true
    pointodyssey_sequence_length: 2
    pointodyssey_num_pts_to_track: 32
    use_all_valid: true
  kitti2012:
    datapath: /home/spencer/Data/correspondence/kitti
    normalize_images: true
  kitti2015:
    datapath: /home/spencer/Data/correspondence/kitti
    normalize_images: true
  flyingthings:
    datapath: /home/spencer/Data/FlyingThings3D_10k
    normalize_images: true
  tss:
    datapath: /home/spencer/Data/correspondence/TSS_CVPR2016
    normalize_images: true
  middlebury:
    datapath: /home/spencer/Data/middlebury/all
    normalize_images: true
  movi_f:
    datapath: /home/spencer/Data/kubric_tfds/movi_f/512x512/1.0.0
    kubric_dir: /home/spencer/Projects/kubric
    normalize_images: false
    movi_f_config: 512x512
    movi_f_shuffle_buffer: 16
datasets:
- name: kitti2015
  split: val
  representation: flow
  is_eval: true
- name: kitti2012
  split: val
  representation: flow
  is_eval: true
- name: flyingthings
