# Small sanity run for search_sdf_kitti2015_real_cold/best_trial_0002_theta.json

model:
  backbone: 'resnet101'
  freeze: true
  pretrained_backbone: true

training:
  epochs: 1
  batch_size: 2
  n_threads: 0
  seed: 2021
  lr: 3e-4
  lr_backbone: 3e-6
  weight_decay: 0.05
  momentum: 0.9
  scheduler: 'step'
  step: '[70, 80, 90]'
  step_gamma: 0.5
  steps_per_epoch: 10
  augmentation: true
  min_flow_length: null
  max_flow_length: null
  mmd_every_n_epochs: 0
  eval_initial: false
  enable_debug: false
  debug_visualization_benchmarks: null
  debug_visualization_persist: false

dataset:
  dataset_name: 'synthetic'
  split: 'train'
  size: [512, 512]
  downsample_flow: 32
  max_kps: null
  dense_kps_use_all: true
  verbose: false
  debug: false
  normalize_images: false
  geometry_config_path: 'src/configs/online_synth_configs/OnlineGeometryConfig.yaml'
  processor_config_path: 'src/configs/online_synth_configs/OnlineProcessorConfig.yaml'
  opengl_device_index: null
  geometry_config_overrides:
    angle_sampler:
      x_components:
        distribution: 'uniform'
        loc: -0.4795163872087673
        scale: 0.11420549782900892
      y_components:
        distribution: 'uniform'
        loc: -0.20577840020033744
        scale: 0.1368517686712153
      bounds: [0.5, 0.25]
    scale_sampler:
      abs_components:
        distribution: 'uniform'
        loc: 0.6553877528963032
        scale: 0.4182239110388646
      rel_components:
        distribution: 'uniform'
        loc: -0.09322530542446952
        scale: 0.19345945858809516

evaluation:
  eval_benchmarks: ['kitti2015']
  eval_alphas: [0.01]
  thres: 'img'
  split_to_use_for_validation: 'val'
  val_batch_size: 2
  val_num_workers: 0
  prefetch_factor: 2
  use_motion_aware: false
  min_motion_pixels: 5.0
  zero_threshold: 0.5
  datapath: './models/Datasets_CATs'
  tss_root: '/home/spencer/Data/correspondence/TSS_CVPR2016'
  kitti_root: '/home/spencer/Data/correspondence/kitti'
  kitti_val_use_full_training: false
  pointodyssey_root: '/home/spencer/Data/PointOdyssey'
  flyingthings_root: '/home/spencer/Data/FlyingThings3D_tiny'
  val_datasets:
    kitti2015:
      split: 'val'
      normalize_images: true
      max_pts: 200

paths:
  snapshots: './snapshots_sanity'
  pretrained: null
  start_epoch: 0
