# Search-discovered θ from interventional-study LOTO widebnds 100-trial run.
# Study: search_sdf_kitti2015_loto_widebnds_200k_100t  (seed=7, 100 trials)
# Trial #76 — best across the run.
# Predictor: full_fit/peak_pck/motion_mean_nn__score-kitti2015.pkl
#   (LOTO, --feature-subset mean_nn, --exclude-false-true)
# Search-time prediction (predicted, not empirical):
#   raw_g          = +4.24
#   calibrated_g   = +10.39  (= fitness, penalized_calibrated_g)
#   pred KITTI2015 = 87.55
# Anchor for comparison:
#   synthetic_large_zoom: raw_g=+3.31, fitness=+7.96, predK=86.62
#
# Pretrained-but-frozen ResNet101 encoder, KITTI-2015 val only —
# matches sdf_kitti2015_large_zoom.yaml for apples-to-apples comparison.

model:
  backbone: 'resnet101'
  freeze: true
  pretrained_backbone: true

training:
  epochs: 50
  batch_size: 8
  n_threads: 0
  seed: 2021
  lr: 3e-4
  lr_backbone: 3e-6
  weight_decay: 0.05
  momentum: 0.9
  scheduler: 'step'
  step: '[70, 80, 90]'
  step_gamma: 0.5
  steps_per_epoch: 100
  augmentation: true
  min_flow_length: null
  max_flow_length: null
  mmd_every_n_epochs: 0
  eval_initial: false
  enable_debug: false
  debug_visualization_benchmarks: null
  debug_visualization_persist: false

dataset:
  dataset_name: 'synthetic'
  split: 'train'
  size: [512, 512]
  downsample_flow: 32
  max_kps: null
  dense_kps_use_all: true
  verbose: false
  debug: false
  normalize_images: false
  geometry_config_path: 'src/configs/online_synth_configs/OnlineGeometryConfig.yaml'
  processor_config_path: 'src/configs/online_synth_configs/OnlineProcessorConfig.yaml'
  opengl_device_index: null
  geometry_config_overrides:
    angle_sampler:
      x_components:
        loc: -0.014206189542174175
        scale: 0.029513340695549034
      y_components:
        loc: -0.036683958715967344
        scale: 0.049950871981682105
    scale_sampler:
      abs_components:
        loc: 0.4882856892619327
        scale: 0.18393251862446852
      rel_components:
        loc: -0.16308826903005477
        scale: 0.27926430680097813

evaluation:
  eval_benchmarks: ['kitti2015']
  eval_alphas: [0.05]
  thres: 'img'
  split_to_use_for_validation: 'val'
  val_batch_size: 8
  val_num_workers: 32
  prefetch_factor: 4
  use_motion_aware: false
  min_motion_pixels: 5.0
  zero_threshold: 0.5
  datapath: './models/Datasets_CATs'
  tss_root: '/home/spencer/Data/correspondence/TSS_CVPR2016'
  kitti_root: '/home/spencer/Data/correspondence/kitti'
  kitti_val_use_full_training: true   # whole KITTI-2015 labeled set as val (no 80/20 split)
  pointodyssey_root: '/home/spencer/Data/PointOdyssey'
  flyingthings_root: '/home/spencer/Data/FlyingThings3D_tiny'
  val_datasets:
    kitti2015:
      split: 'val'
      normalize_images: true
      max_pts: 200

paths:
  snapshots: '/mnt/nvme_1tb_b/snapshots'   # off the full root disk; _1tb_a has 3x more free if preferred
  save_epoch_checkpoints: false            # keep only model_best/{benchmark}_best/last.pth (~0.7GB vs ~12GB)
  pretrained: null
  start_epoch: 0
