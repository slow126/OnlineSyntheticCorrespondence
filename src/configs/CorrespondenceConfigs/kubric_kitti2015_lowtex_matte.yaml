# Appearance ablation — trial19 camera/motion held fixed, appearance degraded.
# Same θ as kitti2015_hq_trial19 EXCEPT: keep_asset_materials=false (solid colors),
# background_mode=matte (flat bg). asset_source stays 'gso' so SHAPES/motion are
# unchanged -> this is the appearance-only (motion-decoupled) variant.
# Baseline for comparison = kubric trial19 hq (already trained: kitti2015 peak 96.12).
# Training config is byte-identical to trial19 (lr 3e-5, aug off, freeze=True) for
# apples-to-apples; only dataset.datapath + paths changed.
dataset:
  datapath: /mnt/nvme_1tb_a/kubric_interventions/datasets/kitti2015_lowtex_matte_5000
  dataset_name: kubric_intervention
  debug: false
  dense_kps_use_all: true
  downsample_flow: 32
  max_kps: null
  normalize_images: true
  reverse_flow: false
  size:
  - 512
  - 512
  split: train
  verbose: false
evaluation:
  datapath: ./models/Datasets_CATs
  eval_alphas:
  - 0.05
  eval_benchmarks:
  - kitti2015
  flyingthings_root: /home/spencer/Data/FlyingThings3D_tiny
  kitti_root: /home/spencer/Data/correspondence/kitti
  kitti_val_use_full_training: true
  min_motion_pixels: 5.0
  pointodyssey_root: /home/spencer/Data/PointOdyssey
  prefetch_factor: 4
  split_to_use_for_validation: val
  thres: img
  tss_root: /home/spencer/Data/correspondence/TSS_CVPR2016
  use_motion_aware: false
  val_batch_size: 8
  val_datasets:
    kitti2015:
      max_pts: 200
      normalize_images: true
      split: val
  val_num_workers: 32
  zero_threshold: 0.5
model:
  backbone: resnet101
  freeze: true
  pretrained_backbone: true
paths:
  pretrained: null
  snapshots: /mnt/nvme_1tb_b/snapshots
  save_epoch_checkpoints: false
  start_epoch: 0
training:
  augmentation: false
  batch_size: 8
  check_val_every_n_epoch: 1
  debug_visualization_benchmarks: null
  debug_visualization_persist: false
  enable_debug: false
  epochs: 50
  eval_initial: false
  lr: 3e-5
  lr_backbone: 3e-6
  max_flow_length: null
  min_flow_length: null
  mmd_every_n_epochs: 0
  momentum: 0.9
  n_threads: 4
  scheduler: step
  seed: 2021
  step: '[70, 80, 90]'
  step_gamma: 0.5
  steps_per_epoch: 100
  weight_decay: 0.05
