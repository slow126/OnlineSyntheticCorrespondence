# Comparison run: same as sdf_kitti2015_trial0002 but with large_zoom sampler
# (overrides copied from src/configs/lightning/datasets/synthetic_rc_large_zoom.yaml).
# Pretrained-but-frozen ResNet101 encoder, KITTI-2015 val only.

model:
  backbone: 'resnet101'
  freeze: true
  pretrained_backbone: true

training:
  epochs: 50
  batch_size: 8
  n_threads: 0
  seed: 2021
  lr: 3e-4
  lr_backbone: 3e-6
  weight_decay: 0.05
  momentum: 0.9
  scheduler: 'step'
  step: '[70, 80, 90]'
  step_gamma: 0.5
  steps_per_epoch: 100
  augmentation: true
  min_flow_length: null
  max_flow_length: null
  mmd_every_n_epochs: 0
  eval_initial: false
  enable_debug: false
  debug_visualization_benchmarks: null
  debug_visualization_persist: false

dataset:
  dataset_name: 'synthetic'
  split: 'train'
  size: [512, 512]
  downsample_flow: 32
  max_kps: null
  dense_kps_use_all: true
  verbose: false
  debug: false
  normalize_images: false
  geometry_config_path: 'src/configs/online_synth_configs/OnlineGeometryConfig.yaml'
  processor_config_path: 'src/configs/online_synth_configs/OnlineProcessorConfig.yaml'
  opengl_device_index: null
  geometry_config_overrides:
    angle_sampler:
      x_components:
        loc: 0
        scale: 0.01
      y_components:
        loc: 0
        scale: 0.01
    scale_sampler:
      abs_components:
        scale: 0.5
      rel_components:
        loc: -0.35
        scale: 0.5

evaluation:
  eval_benchmarks: ['kitti2015']
  eval_alphas: [0.05]
  thres: 'img'
  split_to_use_for_validation: 'val'
  val_batch_size: 8
  val_num_workers: 32
  prefetch_factor: 4
  use_motion_aware: false
  min_motion_pixels: 5.0
  zero_threshold: 0.5
  datapath: './models/Datasets_CATs'
  tss_root: '/home/spencer/Data/correspondence/TSS_CVPR2016'
  kitti_root: '/home/spencer/Data/correspondence/kitti'
  kitti_val_use_full_training: false
  pointodyssey_root: '/home/spencer/Data/PointOdyssey'
  flyingthings_root: '/home/spencer/Data/FlyingThings3D_tiny'
  val_datasets:
    kitti2015:
      split: 'val'
      normalize_images: true
      max_pts: 200

paths:
  snapshots: './snapshots'
  pretrained: null
  start_epoch: 0
