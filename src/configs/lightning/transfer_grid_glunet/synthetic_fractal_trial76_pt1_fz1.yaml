dataset:
  dataset_name: synthetic
  debug: false
  dense_kps_use_all: true
  downsample_flow: null
  geometry_config_overrides:
    angle_sampler:
      x_components:
        loc: -0.014206189542174175
        scale: 0.029513340695549034
      y_components:
        loc: -0.036683958715967344
        scale: 0.049950871981682105
    scale_sampler:
      abs_components:
        loc: 0.4882856892619327
        scale: 0.18393251862446852
      rel_components:
        loc: -0.16308826903005477
        scale: 0.27926430680097813
  geometry_config_path: src/configs/online_synth_configs/OnlineGeometryConfig.yaml
  max_kps: null
  normalize_images: false
  opengl_device_index: null
  processor_config_path: src/configs/online_synth_configs/OnlineProcessorConfig.yaml
  size:
  - 512
  - 512
  split: train
  verbose: false
evaluation:
  eval_benchmarks:
  - kitti2015
  - kitti2012
  - flyingthings
  eval_alphas:
  - 0.05
  - 0.05
  - 0.05
  thres: img
  split_to_use_for_validation: test
  val_batch_size: 8
  val_num_workers: 8
  prefetch_factor: 2
  use_motion_aware: false
  min_motion_pixels: 5.0
  zero_threshold: 0.5
  datapath: ./models/Datasets_CATs
  tss_root: /home/spencer/Data/correspondence/TSS_CVPR2016
  kitti_root: /home/spencer/Data/correspondence/kitti
  kitti_val_use_full_training: true
  pointodyssey_root: /home/spencer/Data/PointOdyssey
  flyingthings_root: /home/spencer/Data/FlyingThings3D_tiny
  middlebury_root: /home/spencer/Data/middlebury/all
  val_datasets:
    kitti2015:
      split: val
      normalize_images: true
    kitti2012:
      split: val
      normalize_images: true
    flyingthings:
      split: test
      normalize_images: true
      val_dataset_fraction: 0.2
model:
  type: glunet
  glunet:
    model_name: resnet50
    local_window_size: 9
    decoder_dense_connect: false
  pretrained_backbone: true
  freeze: true
paths:
  pretrained: null
  snapshots: /mnt/nvme_1tb_a/snapshots/transfer_grid_glunet
  start_epoch: 0
  save_epoch_checkpoints: false
training:
  epochs: 100
  batch_size: 8
  n_threads: 0
  seed: 2021
  lr: 0.001
  lr_backbone: 1.0e-05
  weight_decay: 0.0005
  momentum: 0.9
  scheduler: cosine
  step: '[70, 80, 90]'
  step_gamma: 0.5
  gradient_clip_val: 1.0
  steps_per_epoch: 100
  check_val_every_n_epoch: 5
  augmentation: false
  min_flow_length: null
  max_flow_length: null
  mmd_every_n_epochs: 0
  eval_initial: false
  enable_debug: false
  debug_visualization_benchmarks: null
  debug_visualization_persist: false
