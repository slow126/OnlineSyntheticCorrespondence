# Dataset-only config (extracted for the GLU-Net unified split-config sweep).
# Source: src/configs/CorrespondenceConfigs/sdf_kitti2015_large_zoom.yaml -- only the dataset section.
dataset:
  dataset_name: synthetic
  split: train
  size:
  - 512
  - 512
  downsample_flow: 32
  max_kps: null
  dense_kps_use_all: true
  verbose: false
  debug: false
  normalize_images: false
  geometry_config_path: src/configs/online_synth_configs/OnlineGeometryConfig.yaml
  processor_config_path: src/configs/online_synth_configs/OnlineProcessorConfig.yaml
  opengl_device_index: null
  geometry_config_overrides:
    angle_sampler:
      x_components:
        loc: 0
        scale: 0.01
      y_components:
        loc: 0
        scale: 0.01
    scale_sampler:
      abs_components:
        scale: 0.5
      rel_components:
        loc: -0.35
        scale: 0.5
