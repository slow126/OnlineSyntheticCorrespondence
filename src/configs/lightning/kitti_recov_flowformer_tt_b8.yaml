# FlowFormer intervention: KITTI-recovered (tuned) source, PRETRAINED + FROZEN (TT).
# ImageNet Twins-SVT encoders, both frozen; cost-memory encoder + decoder train.
# Effective batch 8 = batch_size 1 x accumulate_grad_batches 8. downsample_flow=null.
dataset:
  datapath: /mnt/nvme_1tb_a/kubric_interventions/datasets/kitti_recovered_hq_5000
  dataset_name: kubric_intervention
  kubric_max_pairs: 2500
  mirror_flip: 0.0
  downsample_flow: null
  dense_kps_use_all: true
  max_kps: null
  normalize_images: true
  reverse_flow: false
  size:
  - 512
  - 512
  split: train
  debug: false
  verbose: false
evaluation:
  datapath: ./models/Datasets_CATs
  eval_alphas:
  - 0.05
  - 0.05
  eval_benchmarks:
  - kitti2015
  - kitti2012
  flyingthings_root: /home/spencer/Data/FlyingThings3D_tiny
  kitti_root: /home/spencer/Data/correspondence/kitti
  kitti_val_use_full_training: true
  middlebury_root: /home/spencer/Data/middlebury/all
  min_motion_pixels: 5.0
  pointodyssey_root: /home/spencer/Data/PointOdyssey
  prefetch_factor: 2
  split_to_use_for_validation: test
  thres: img
  tss_root: /home/spencer/Data/correspondence/TSS_CVPR2016
  use_motion_aware: false
  val_batch_size: 2
  val_num_workers: 8
  zero_threshold: 0.5
  val_datasets:
    kitti2012:
      normalize_images: true
      split: val
    kitti2015:
      normalize_images: true
      split: val
model:
  type: flowformer
  pretrain: true
  freeze: true
  iters: 12
  pretrained_path: null
paths:
  pretrained: null
  save_epoch_checkpoints: false
  snapshots: /mnt/nvme_1tb_a/snapshots/flowformer_kittirecov_tt_b8
  start_epoch: 0
training:
  batch_size: 1
  accumulate_grad_batches: 8
  epochs: 15
  steps_per_epoch: 400
  check_val_every_n_epoch: 1
  lr: 2.5e-4
  lr_backbone: 2.5e-6
  weight_decay: 1.0e-4
  momentum: 0.9
  scheduler: step
  step: '[70, 80, 90]'
  step_gamma: 0.5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: 'norm'
  augmentation: false
  eval_initial: false
  mmd_every_n_epochs: 0
  min_flow_length: null
  max_flow_length: null
  n_threads: 8
  seed: 2021
