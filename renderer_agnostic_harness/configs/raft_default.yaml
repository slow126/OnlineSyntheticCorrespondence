dataset:
  dataset_name: synthetic
  debug: false
  dense_kps_use_all: true
  downsample_flow: null
  geometry_config_overrides: null
  geometry_config_path: src/configs/online_synth_configs/OnlineGeometryConfig.yaml
  max_kps: null
  normalize_images: true
  opengl_device_index: null
  processor_config_path: src/configs/online_synth_configs/OnlineProcessorConfig.yaml
  size:
  - 512
  - 512
  split: train
  verbose: false
model:
  type: raft
  small: false
  freeze: false
  pretrained_backbone: false
  iters: 12
training:
  augmentation: false
  batch_size: 8
  check_val_every_n_epoch: 1
  enable_debug: false
  epochs: 40
  eval_initial: false
  # RAFT-stable recipe: OneCycle warmup+anneal, gradient clipping, low weight decay.
  # The prior step/no-clip/wd0.05 recipe diverged after ep1 on every SDF source.
  lr: 4e-4
  lr_backbone: 4e-4
  scheduler: onecycle
  onecycle_pct_start: 0.05
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  weight_decay: 1e-5
  max_flow_length: null
  min_flow_length: null
  mmd_every_n_epochs: 0
  momentum: 0.9
  n_threads: 4
  seed: 2021
  steps_per_epoch: 250
evaluation:
  datapath: ./models/Datasets_CATs
  eval_alphas:
  - 0.05
  - 0.05
  eval_benchmarks:
  - kitti2015
  - kitti2012
  flyingthings_root: /home/spencer/Data/FlyingThings3D_tiny
  kitti_root: /home/spencer/Data/correspondence/kitti
  kitti_val_use_full_training: true
  middlebury_root: /home/spencer/Data/middlebury/all
  min_motion_pixels: 5.0
  pointodyssey_root: /home/spencer/Data/PointOdyssey
  prefetch_factor: 2
  split_to_use_for_validation: test
  thres: img
  tss_root: /home/spencer/Data/correspondence/TSS_CVPR2016
  tapvid_davis_root: /mnt/nvme_1tb_a/tapvid/probe_cache
  use_motion_aware: false
  val_batch_size: 2
  val_datasets:
    kitti2015:
      split: val
      normalize_images: true
    kitti2012:
      split: val
      normalize_images: true
  val_num_workers: 4
  zero_threshold: 0.5
paths:
  pretrained: null
  snapshots: /mnt/nvme_1tb_a/renderer_agnostic
  start_epoch: 0
  save_epoch_checkpoints: true
  run_name: raft_default
