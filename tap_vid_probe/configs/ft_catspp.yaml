  val_datasets:
    tapvid_davis:
      tapvid_stride: 6
      tapvid_frame_step: 5
      tapvid_min_pts: 1
      reverse_flow: true
      normalize_images: true
    kitti2012:
      split: val
      normalize_images: true
    kitti2015:
      split: val
      normalize_images: true
