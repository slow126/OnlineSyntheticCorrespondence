  eval_initial: true
  lr: 3e-5
  lr_backbone: 3e-6
  weight_decay: 0.05
  momentum: 0.9
  scheduler: step
  step: '[70, 80, 90]'
  step_gamma: 0.5
  augmentation: false
  mmd_every_n_epochs: 0
  min_flow_length: null
  max_flow_length: null
  n_threads: 2
  seed: 2021
  enable_debug: false
  debug_visualization_benchmarks: null
  debug_visualization_persist: false
paths:
  snapshots: /mnt/nvme_1tb_a/tapvid_probe_snapshots/ft_catspp
  pretrained: null
  start_epoch: 0
  save_epoch_checkpoints: false
evaluation:
  eval_benchmarks:
  - tapvid_davis
  - kitti2015
  - kitti2012
  - tss
  - pfpascal
  - pfwillow
  eval_alphas:
  - 0.03
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  thres: img
  split_to_use_for_validation: test
  val_batch_size: 2
  val_num_workers: 2
  prefetch_factor: 2
  use_motion_aware: false
  min_motion_pixels: 5.0
  zero_threshold: 0.5
  datapath: ./models/Datasets_CATs
  tss_root: /home/spencer/Data/correspondence/TSS_CVPR2016
  kitti_root: /home/spencer/Data/correspondence/kitti
