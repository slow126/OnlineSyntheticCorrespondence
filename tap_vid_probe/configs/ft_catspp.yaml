dataset:
  dataset_name: flyingthings
  datapath: /home/spencer/Data/FlyingThings3D_10k
  size:
  - 512
  - 512
  dense_kps_use_all: true
  max_kps: null
  normalize_images: true
  reverse_flow: true
  split: train
  debug: false
  verbose: false
  downsample_flow: 32
model:
  type: cats
  backbone: resnet101
  freeze: false
  pretrained_backbone: true
