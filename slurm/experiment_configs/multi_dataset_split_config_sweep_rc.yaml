# Example Multi-Dataset Sweep Configuration with Split Configs
# This file demonstrates the new split config format where:
# - Dataset configs contain only dataset-specific parameters
# - Training base config contains shared model/training parameters
# - Eval base config contains shared evaluation parameters
# This prevents conflicts when sweeping training parameters vs eval parameters

# Project root directory (required for resolving relative paths)
project_root: "/home/slow1/Projects/OnlineSyntheticCorrespondence"

# Base configs (shared across all datasets)
training_base: "src/configs/lightning/training_base_rc.yaml"
eval_base: "src/configs/lightning/eval_base_rc.yaml"

# Define training datasets to sweep across
training_datasets:
  - name: "sintel"
    dataset_config: "src/configs/lightning/datasets/sintel_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 16

  - name: "flyingthings"
    dataset_config: "src/configs/lightning/datasets/flyingthings_rc.yaml"
    overrides:
      # Can override training params per dataset if needed
      training.batch_size: 8
      training.n_threads: 16
      
  - name: "spair"
    dataset_config: "src/configs/lightning/datasets/spair_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 16
      
  - name: "pointodyssey"
    dataset_config: "src/configs/lightning/datasets/pointodyssey_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 16
      
  - name: "synthetic"
    dataset_config: "src/configs/lightning/datasets/synthetic_rc.yaml"
    overrides:
      # Synthetic-specific training overrides
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

  - name: "synthetic_middlebury"
    dataset_config: "src/configs/lightning/datasets/synthetic_middlebury_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

  - name: "synthetic_small_zoom"
    dataset_config: "src/configs/lightning/datasets/synthetic_rc_small_zoom.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

  - name: "synthetic_large_zoom"
    dataset_config: "src/configs/lightning/datasets/synthetic_rc_large_zoom.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

  - name: "synthetic_random_flipping"
    dataset_config: "src/configs/lightning/datasets/synthetic_rc_random_flipping.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

  # Mixed datasets with 70-30 splits (70% real dataset, 30% synthetic)
  - name: "spair_synthetic_70_30"
    dataset_config: "src/configs/lightning/datasets/spair_synthetic_70_30_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  # Mixed datasets with 50-50 splits
  - name: "spair_synthetic_50_50"
    dataset_config: "src/configs/lightning/datasets/spair_synthetic_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  # Mixed datasets with 30-70 splits (30% real dataset, 70% synthetic)
  - name: "spair_synthetic_30_70"
    dataset_config: "src/configs/lightning/datasets/spair_synthetic_30_70_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "pointodyssey_synthetic_70_30"
    dataset_config: "src/configs/lightning/datasets/pointodyssey_synthetic_70_30_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "pointodyssey_synthetic_30_70"
    dataset_config: "src/configs/lightning/datasets/pointodyssey_synthetic_30_70_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "flyingthings_synthetic_70_30"
    dataset_config: "src/configs/lightning/datasets/flyingthings_synthetic_70_30_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "flyingthings_synthetic_30_70"
    dataset_config: "src/configs/lightning/datasets/flyingthings_synthetic_30_70_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "sintel_synthetic_70_30"
    dataset_config: "src/configs/lightning/datasets/sintel_synthetic_70_30_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

  - name: "sintel_synthetic_30_70"
    dataset_config: "src/configs/lightning/datasets/sintel_synthetic_30_70_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed datasets with synthetic need num_workers=0

# Output directory for generated configs
# Relative paths starting with 'slurm/' or 'experiment_configs/' are resolved relative to project root
# Other relative paths are resolved relative to this config file's directory
output_dir: "/home/slow1/Projects/OnlineSyntheticCorrespondence/slurm/experiment_configs/generated_2"

# Sweep definitions (applied to all datasets)
# These only affect training/model parameters, not eval config
sweeps:
  # Backbone sweep across pretrained/freeze combinations
  - name: "encoder_grid"
    parameters:
      training.steps_per_epoch: 100
      model.pretrained_backbone: [True, False]
      model.freeze: [True, False]
    name_template: "steps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"
  
