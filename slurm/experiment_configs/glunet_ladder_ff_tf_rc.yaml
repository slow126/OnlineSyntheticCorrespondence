# GLU-Net motion-ladder grid (FF + TF) on the 20 kitti motion x appearance datasets.
# FF = scratch trainable encoder, TF = ImageNet-pretrained trainable encoder
# (apples-to-apples: both freeze=False, only init differs). Eval on full suite
# incl. kitti2012/kitti2015/flyingthings. Datapaths are per-dataset (kubric_root
# stays unset in the machine config, so each config's own path is kept).
#
# Generate on RC:
#   python slurm/generate_experiments.py -M slurm/machine_configs/remote_long.yaml \
#       -S slurm/experiment_configs/glunet_ladder_ff_tf_rc.yaml -O slurm/glunet_jobs_ladder
#   bash slurm/glunet_jobs_ladder/submit_all.sh

project_root: "/home/slow1/Projects/OnlineSyntheticCorrespondence"
training_base: "src/configs/lightning/glunet_training_base_rc.yaml"
eval_base: "src/configs/lightning/eval_base_rc_fastsynth.yaml"

