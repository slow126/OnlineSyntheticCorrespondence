output_dir: "/home/slow1/Projects/OnlineSyntheticCorrespondence/slurm/experiment_configs/generated_glunet_ladder"

sweeps:
  - name: "scratch_unfrozen"
    parameters:
      model.type: glunet
      training.epochs: 100
      training.steps_per_epoch: 100
      training.check_val_every_n_epoch: 20
      training.seed: 2021
      training.scheduler: cosine
      training.gradient_clip_val: 1.0
      paths.save_epoch_checkpoints: false
      dataset.downsample_flow: null
      model.pretrained_backbone: false
      model.freeze: false
    name_template: "glunet_ladder_steps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"
  - name: "pretrained_unfrozen"
    parameters:
      model.type: glunet
      training.epochs: 100
      training.steps_per_epoch: 100
      training.check_val_every_n_epoch: 20
      training.seed: 2021
      training.scheduler: cosine
      training.gradient_clip_val: 1.0
      paths.save_epoch_checkpoints: false
      dataset.downsample_flow: null
      model.pretrained_backbone: true
      model.freeze: false
    name_template: "glunet_ladder_steps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"
