# Example Multi-Dataset Sweep Configuration with Split Configs
# This file demonstrates the new split config format where:
# - Dataset configs contain only dataset-specific parameters
# - Training base config contains shared model/training parameters
# - Eval base config contains shared evaluation parameters
# This prevents conflicts when sweeping training parameters vs eval parameters

# Project root directory (required for resolving relative paths)
project_root: "/home/slow1/Projects/OnlineSyntheticCorrespondence"

# Base configs (shared across all datasets)
training_base: "src/configs/lightning/training_base_rc.yaml"
eval_base: "src/configs/lightning/eval_base_rc.yaml"

# Define training datasets to sweep across
training_datasets:
  - name: "sintel"
    dataset_config: "src/configs/lightning/datasets/sintel_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 16

# Output directory for generated configs
# Relative paths starting with 'slurm/' or 'experiment_configs/' are resolved relative to project root
# Other relative paths are resolved relative to this config file's directory
output_dir: "/home/slow1/Projects/OnlineSyntheticCorrespondence/slurm/experiment_configs/generated"

# Sweep definitions (applied to all datasets)
# These only affect training/model parameters, not eval config
sweeps:
  # Example: Logarithmic steps_per_epoch sweep
  - name: "logarithmic_steps_sweep"
    parameters:
      training.steps_per_epoch: ['logarithmic']  # Base 2 progression: 2^epoch, capped at 2048
      model.freeze: [True, False]
      model.pretrained_backbone: [True, False]
    name_template: "logsteps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"
