# Simple Example Experiment Configuration
# This is a minimal example to get started

# Base parameters applied to all experiments
base:
  epochs: 50
  batch-size: 8
  lr: 3e-4
  lr-backbone: 3e-6
  freeze: true
  augmentation: true
  feature_size: 32
  size: 512
  split_to_use_for_validation: "val"
  scheduler: "step"
  step: "[70, 80, 90]"
  step_gamma: 0.5
  weight-decay: 0.05
  momentum: 0.9
  thres: "img"
  val_batch_size: 8
  val_num_workers: 16
  enable_debug: false

# Simple grid: just test different datasets
grids:
  - name: "dataset_test"
    parameters:
      train_dataset: ["flyingthings", "pointodyssey"]
      eval_benchmarks: [["spair", "pfpascal"]]
      eval_alphas: [[0.1, 0.1]]
    name_template: "{train_dataset}_test"

# Or define individual experiments
experiments:
  - name: "flyingthings_simple"
    train_dataset: "flyingthings"
    eval_benchmarks: ["spair"]
    eval_alphas: [0.1]
    epochs: 10  # Override base epochs

# Dataset-specific defaults
dataset_defaults:
  pointodyssey:
    num_pts_to_track_pointodyssey: 32
    strides_pointodyssey: [4]
    all_points_pointodyssey: false
    verbose_pointodyssey: false

