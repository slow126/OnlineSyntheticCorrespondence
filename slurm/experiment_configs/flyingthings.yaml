# Experiment Configuration File
# Define experiments using parameter grids or individual experiments

# Base parameters applied to all experiments (unless overridden)
base:
  epochs: 50
  batch-size: 8
  lr: 3e-4
  lr-backbone: 3e-6
  freeze: true
  augmentation: true
  feature_size: 32
  size: 512
  split_to_use_for_validation: "test"
  scheduler: "step"
  step_gamma: 0.5
  weight-decay: 0.05
  momentum: 0.9
  thres: "img"
  val_batch_size: 8
  enable_debug: false
  steps_per_epoch: logarithmic
  pointodyssey_val_max_sequences: 5

# Parameter grids - generates all combinations
grids:
  # Example grid: train_dataset x eval_config x learning_rate
  - name: "flyingthings freeze sweep"
    parameters:
      eval_benchmarks: 
        - ["tss", "pfpascal", "pfwillow", "spair", "pointodyssey"]
      train_dataset: ["flyingthings"]
      freeze:
        - True
        - False
    name_template: "{train_dataset}_freeze{freeze}"




  


