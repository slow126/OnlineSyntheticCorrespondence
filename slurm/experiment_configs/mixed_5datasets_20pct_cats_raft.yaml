# Mixed 5-dataset config with 20% each + CATs++ encoder grid and RAFT run

project_root: "/home/spencer/Projects/OnlineSyntheticCorrespondence"

training_base: "src/configs/lightning/training_base.yaml"
eval_base: "src/configs/lightning/eval_base.yaml"

training_datasets:
  - name: "mixed_5datasets_20pct"
    dataset_config: "src/configs/lightning/datasets/mixed_5datasets_20pct.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # Mixed dataset includes synthetic

output_dir: "slurm/experiment_configs/generated_mixed_5datasets_20pct"

sweeps:
  # CATs++ encoder grid (4 runs)
  - name: "cats_encoder_grid"
    parameters:
      model.type: cats
      training.steps_per_epoch: 100
      model.pretrained_backbone: [True, False]
      model.freeze: [True, False]
    name_template: "cats_steps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"

  # RAFT full run (1 run)
  - name: "raft_full"
    parameters:
      model.type: raft
      model.small: false
      model.iters: 12
      model.alternate_corr: false
      model.mixed_precision: false
      model.dropout: 0.0
      dataset.downsample_flow: null
    name_template: "raft_full"
