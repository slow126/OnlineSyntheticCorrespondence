# Synthetic 2D-Warp dataset with CATs++ encoder grid + RAFT (RC)

project_root: "/home/slow1/Projects/OnlineSyntheticCorrespondence"

training_base: "src/configs/lightning/training_base_rc.yaml"
eval_base: "src/configs/lightning/eval_base_rc.yaml"

training_datasets:
  - name: "synthetic_2d_warp"
    dataset_config: "src/configs/lightning/datasets/synthetic_2d_warp_rc.yaml"
    overrides:
      training.batch_size: 8
      training.n_threads: 0  # GPU-bound rendering

output_dir: "/home/slow1/Projects/OnlineSyntheticCorrespondence/slurm/experiment_configs/generated_synthetic_2d_warp_rc"

sweeps:
  # CATs++ encoder grid (4 runs)
  - name: "cats_encoder_grid"
    parameters:
      model.type: cats
      training.steps_per_epoch: 100
      model.pretrained_backbone: [True, False]
      model.freeze: [True, False]
    name_template: "cats_steps{training.steps_per_epoch}_pretrained{model.pretrained_backbone}_freeze{model.freeze}"

  # RAFT full run (1 run)
  - name: "raft_full"
    parameters:
      model.type: raft
      model.small: false
      model.iters: 12
      model.alternate_corr: false
      model.mixed_precision: false
      model.dropout: 0.0
      dataset.downsample_flow: null
    name_template: "raft_full"
